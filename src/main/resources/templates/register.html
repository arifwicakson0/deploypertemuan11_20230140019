<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Register Akun</title>
</head>
<body>

<h2>Form Registrasi Akun Baru</h2>

<form th:action="@{/register}" method="post" th:object="${request}">

    <div>
        <label>Username:</label><br>
        <input type="text" th:field="*{username}" placeholder="Masukkan Username" required>
    </div>
    <br>
    <div>
        <label>Password:</label><br>
        <input type="password" th:field="*{password}" placeholder="Masukkan Password" required>
    </div>
    <br>
    <div>
        <label>Nama Lengkap:</label><br>
        <input type="text" th:field="*{nama}" placeholder="Masukkan Nama Lengkap" required>
    </div>
    <br>
    <div>
        <label>Alamat:</label><br>
        <input type="text" th:field="*{alamat}" placeholder="Masukkan Alamat" required>
    </div>
    <br>
    <button type="submit">Daftar Sekarang</button>

</form>

<br>
<p>Sudah punya akun?</p>
<a th:href="@{/login}">Login disini</a>

</body>
</html>
